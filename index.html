<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Reelio — Baixar Vídeos do Instagram</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#6c47ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
  :root {
    --bg-dark: #0f0c1b;
    --card-bg: #19142b;
    --accent: #6c47ff;
    --accent-glow: rgba(108, 71, 255, 0.35);
    --violet: #8a3ffc;
    --blue: #0f62fe;
    --text-main: #f4f4f6;
    --text-muted: #a29bfe;
    --input-bg: #231c3d;
    --border: #322856;
    --error: #ff4757;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

  body {
    background: var(--bg-dark);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
  }

  .app {
    width: 100%;
    max-width: 440px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 24px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 80px var(--accent-glow);
  }

  header { text-align: center; margin-bottom: 24px; }
  .mark {
    width: 56px; height: 56px;
    background: linear-gradient(135deg, var(--accent), var(--violet));
    border-radius: 16px; display: flex; align-items: center; justify-content: center;
    margin: 0 auto 12px; box-shadow: 0 8px 16px var(--accent-glow);
  }
  .mark svg { width: 28px; height: 28px; stroke: #fff; }
  h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
  p { font-size: 13px; color: var(--text-muted); margin-top: 4px; line-height: 1.4; }

  .field { position: relative; margin-bottom: 16px; }
  input[type="url"] {
    width: 100%; height: 52px; background: var(--input-bg);
    border: 1px solid var(--border); border-radius: 14px;
    padding: 0 84px 0 16px; color: #fff; font-size: 14px; outline: none;
    transition: all 0.2s;
  }
  input[type="url"]:focus { border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }

  .paste-btn {
    position: absolute; right: 8px; top: 8px; bottom: 8px;
    padding: 0 14px; background: rgba(255,255,255,0.08); border: none;
    border-radius: 10px; color: #fff; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .paste-btn:active { background: rgba(255,255,255,0.16); }

  .primary-btn {
    width: 100%; height: 52px; background: linear-gradient(135deg, var(--accent), var(--violet));
    border: none; border-radius: 14px; color: #fff; font-size: 15px; font-weight: 700;
    cursor: pointer; box-shadow: 0 8px 20px var(--accent-glow); display: flex;
    align-items: center; justify-content: center; gap: 8px; transition: transform 0.1s, opacity 0.2s;
  }
  .primary-btn:active { transform: scale(0.98); }
  .primary-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .status { font-size: 13px; text-align: center; margin-top: 12px; min-height: 18px; color: var(--text-muted); }
  .status.error { color: var(--error); }

  .result { display: none; margin-top: 20px; flex-direction: column; gap: 16px; }
  .result.show { display: flex; }

  .thumb-wrap {
    width: 100%; height: 380px; background: #000; border-radius: 16px;
    overflow: hidden; border: 1px solid var(--border); display: flex;
    align-items: center; justify-content: center;
  }
  .thumb-wrap img, .thumb-wrap video {
    width: 100%; height: 100%; object-fit: contain; background: #000;
  }

  .caption-box {
    background: var(--input-bg); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px; max-height: 120px; overflow-y: auto;
  }
  .caption-label { font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 6px; }
  .caption-text { font-size: 13px; line-height: 1.5; color: #ddd; white-space: pre-wrap; word-break: break-word; }

  .actions { display: flex; flex-direction: column; gap: 8px; }
  .action-btn {
    width: 100%; height: 44px; background: var(--input-bg); border: 1px solid var(--border);
    border-radius: 12px; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s;
  }
  .action-btn:hover { background: #3c2c57; }
  .action-btn.download { background: linear-gradient(120deg, var(--violet), var(--blue)); border: none; }
  .action-btn svg { width: 20px; height: 20px; }

  footer { margin-top: 28px; text-align: center; color: #5f5478; font-size: 12px; line-height: 1.6; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 3v12m0 0l-4.5-4.5M12 15l4.5-4.5M5 20h14" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>Reelio</h1>
    <p>Cole o link de um post, reel ou vídeo público do Instagram. Ele traz o vídeo em HD com áudio e a legenda prontos.</p>
  </header>

  <div class="field">
    <input id="link-input" type="url" inputmode="url" placeholder="https://www.instagram.com/reel/..." autocomplete="off">
    <button class="paste-btn" id="paste-btn">Colar</button>
  </div>

  <button class="primary-btn" id="fetch-btn">
    <svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 19h14" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Buscar mídia
  </button>

  <div class="status" id="status"></div>

  <div class="result" id="result">
    <div class="thumb-wrap">
      <video id="preview-video" controls playsinline crossorigin="anonymous"></video>
      <img id="preview-img" style="display:none; width:100%; height:100%; object-fit:contain;" />
    </div>
    <div class="caption-box">
      <div class="caption-label">Legenda</div>
      <div class="caption-text" id="caption-text">-</div>
    </div>
    <div class="actions">
      <button class="action-btn download" id="download-btn">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 19h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Baixar Mídia
      </button>
      <button class="action-btn" id="copy-btn">
        <svg viewBox="0 0 24 24" fill="none"><rect x="8" y="8" width="12" height="12" rx="2" stroke="currentColor" stroke-width="2"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2" stroke="currentColor" stroke-width="2"/></svg>
        Copiar legenda
      </button>
      <button class="action-btn" id="share-btn">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0-12l-4 4m4-4l4 4M6 17v2a2 2 0 002 2h8a2 2 0 002-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Compartilhar
      </button>
    </div>
  </div>

  <footer>
    Funciona com Reels e vídeos públicos do Instagram.<br>
    Desenvolvido para salvar e reaproveitar seus conteúdos.
  </footer>
</div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(registrations => {
    for (let registration of registrations) {
      registration.unregister();
    }
  });
}

const API_BASE = window.location.origin;

const $ = (id) => document.getElementById(id);
const linkInput = $('link-input');

function setStatus(msg, isError = false) {
  const el = document.getElementById('status');
  if (el) {
    el.textContent = msg;
    if (isError) {
      el.classList.add('error');
    } else {
      el.classList.remove('error');
    }
  }
  console.log('[Status]', msg);
}

const resultEl = $('result');
const previewVideo = $('preview-video');
const previewImg = $('preview-img');
const captionText = $('caption-text');
let currentMediaUrl = null;
let currentCaption = "";
let isCurrentImage = false;

$('paste-btn').addEventListener('click', async () => {
  try {
    const text = await navigator.clipboard.readText();
    linkInput.value = text;
  } catch (e) {
    setStatus('Não consegui acessar a área de transferência — cole manualmente.', true);
  }
});

$('fetch-btn').addEventListener('click', fetchMedia);
linkInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') fetchMedia(); });

async function fetchMedia() {
  const url = linkInput.value.trim();
  if (!url || !/instagram.com/.test(url)) {
    setStatus('Cole um link válido do Instagram.', true);
    return;
  }
  setStatus('Buscando vídeo e áudio...');
  resultEl.classList.remove('show');
  $('fetch-btn').disabled = true;

  try {
    const res = await fetch(`${API_BASE}/extract`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url })
    });
    
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Falha ao extrair a mídia.');

    isCurrentImage = !!data.isImage || (!data.videoUrl && !!data.imageUrl);
    currentMediaUrl = isCurrentImage ? (data.imageUrl || data.videoUrl) : (data.videoUrl || data.imageUrl);
    currentCaption = data.caption || '(sem legenda)';
    
    const mediaTypeParam = isCurrentImage ? 'image' : 'video';
    const proxyUrl = `${API_BASE}/download?url=${encodeURIComponent(currentMediaUrl)}&type=${mediaTypeParam}`;

    if (isCurrentImage) {
      previewVideo.style.display = 'none';
      previewVideo.pause();
      if (previewImg) {
        previewImg.src = proxyUrl;
        previewImg.style.display = 'block';
      }
      $('download-btn').innerHTML = '<svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 19h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Baixar Imagem';
    } else {
      if (previewImg) previewImg.style.display = 'none';
      previewVideo.style.display = 'block';
      previewVideo.src = proxyUrl;
      $('download-btn').innerHTML = '<svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 19h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Baixar Vídeo';
    }

    captionText.textContent = currentCaption;
    resultEl.classList.add('show');
    setStatus('');
  } catch (err) {
    setStatus(err.message || 'Não consegui extrair essa mídia.', true);
  } finally {
    $('fetch-btn').disabled = false;
  }
}

// Botão Baixar Mídia
$('download-btn').addEventListener('click', async () => {
  if (!currentMediaUrl) return;
  const isImg = isCurrentImage;
  setStatus(isImg ? 'Iniciando download da imagem...' : 'Iniciando download do vídeo...');
  
  const mediaTypeParam = isImg ? 'image' : 'video';
  const ext = isImg ? 'jpg' : 'mp4';
  const filename = `reelio-${Date.now()}.${ext}`;
  const downloadProxyUrl = `${API_BASE}/download?url=${encodeURIComponent(currentMediaUrl)}&dl=1&type=${mediaTypeParam}`;

  try {
    const res = await fetch(downloadProxyUrl);
    if (!res.ok) throw new Error('Falha ao baixar arquivo');
    const blob = await res.blob();
    const blobUrl = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    setTimeout(() => {
      URL.revokeObjectURL(blobUrl);
      setStatus('Download concluído com sucesso!');
    }, 4000);
  } catch (e) {
    // Fallback de download direto se o fetch for bloqueado
    const a = document.createElement('a');
    a.href = downloadProxyUrl;
    a.setAttribute('download', filename);
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => setStatus(''), 4000);
  }
});

// Botão Copiar Legenda
$('copy-btn').addEventListener('click', async () => {
  if (!currentCaption) return;
  try {
    await navigator.clipboard.writeText(currentCaption);
    setStatus('Legenda copiada com sucesso!');
  } catch (e) {
    setStatus('Erro ao copiar legenda.', true);
  }
});

// Botão Compartilhar
$('share-btn').addEventListener('click', async () => {
  if (!currentMediaUrl) return;
  
  if (navigator.share) {
    try {
      setStatus('Baixando mídia para compartilhar...');
      const mediaTypeParam = isCurrentImage ? 'image' : 'video';
      const downloadProxyUrl = `${API_BASE}/download?url=${encodeURIComponent(currentMediaUrl)}&type=${mediaTypeParam}`;
      const resp = await fetch(downloadProxyUrl);
      const blob = await resp.blob();
      const ext = isCurrentImage ? 'jpg' : 'mp4';
      const mime = isCurrentImage ? 'image/jpeg' : 'video/mp4';
      const file = new File([blob], `reelio-media.${ext}`, { type: mime });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({
          title: 'Reelio Media',
          text: currentCaption,
          files: [file]
        });
        setStatus('Compartilhado!');
        return;
      } else {
        await navigator.share({
          title: 'Reelio Media',
          text: `${currentCaption}\n\n${currentMediaUrl}`
        });
        setStatus('Link compartilhado!');
        return;
      }
    } catch (e) {
      if (e.name !== 'AbortError') {
        copyMediaLink();
      }
      return;
    }
  }

  copyMediaLink();
});

async function copyMediaLink() {
  try {
    await navigator.clipboard.writeText(currentMediaUrl);
    setStatus('Link copiado para a área de transferência!');
  } catch (e) {
    setStatus('Não foi possível copiar o link.', true);
  }
}
</script>
</body>
</html>
